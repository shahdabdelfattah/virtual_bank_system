spring:
  application:
    name: account-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/account_db}
    username: ${SPRING_DATASOURCE_USERNAME:shahd}
    password: ${SPRING_DATASOURCE_PASSWORD:data123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${ACCOUNT_SERVICE_PORT:8087}